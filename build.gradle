plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.follower'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// src/test holds the runClient launcher (a main method), not JUnit tests. Gradle 9
// treats "test sources present but nothing discovered" as an error by default.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The Plugin Hub builds with Java 11. sourceCompatibility alone only sets the
    // bytecode level - it still compiles against THIS machine's JDK, so a method
    // added after 11 compiles here and fails there. release pins the API set too,
    // so that failure surfaces locally instead of in the submission.
    options.release = 11
    // ./gradlew compileJava -Plint  to surface deprecation/unchecked details
    if (project.hasProperty('lint')) {
        options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
    }
}

// Launches a real RuneLite client with this plugin loaded as a built-in.
// --developer-mode also enables Dev Tools, which is how you find NPC and region ids.
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs RuneLite with Follower Buddy loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.follower.FollowerPluginTest'
    // ExternalPluginManager.loadBuiltin hard-fails without assertions enabled.
    jvmArgs = ['-ea']
    args = ['--developer-mode']

    // Jagex accounts are authenticated by the injected vanilla game client, which
    // reads the JX_* variables the Jagex Launcher puts in RuneLite's environment.
    // Shell inheritance is unreliable here: the Gradle daemon keeps whatever
    // environment it was first started with, so read them from a file instead.
    // jx.env is gitignored - it holds live session tokens.
    // The Jagex Launcher hands the real RuneLite exactly five JX_ variables:
    // JX_SESSION_ID / JX_CHARACTER_ID / JX_DISPLAY_NAME populated, and
    // JX_ACCESS_TOKEN / JX_REFRESH_TOKEN DEFINED BUT EMPTY. We mirror that block
    // exactly so the dev client's login path sees what the real client sees.
    def jxDefaults = ['JX_ACCESS_TOKEN': '', 'JX_REFRESH_TOKEN': '',
                      'JX_SESSION_ID': '', 'JX_CHARACTER_ID': '', 'JX_DISPLAY_NAME': '']
    def jxEnv = file('jx.env')
    if (jxEnv.exists()) {
        def populated = 0
        jxEnv.readLines().each { rawLine ->
            def line = rawLine.trim()
            if (line && !line.startsWith('#')) {
                // Accept KEY=value, and also KEY<tab>value / KEY<spaces>value.
                def m = line =~ /^([A-Za-z_][A-Za-z0-9_]*)\s*(?:=|\t|\s{2,})\s*(.*)$/
                if (m.matches()) {
                    def key = m.group(1)
                    def value = m.group(2).trim()
                    jxDefaults[key] = value
                    if (value) populated++
                }
            }
        }
        jxDefaults.each { k, v -> environment k, v }
        logger.lifecycle("runClient: mirrored JX_ block from jx.env (${populated} populated, ${jxDefaults.size()} defined)")
    } else {
        logger.lifecycle("runClient: no jx.env found - Jagex accounts will not be able to log in")
    }
}

// ---------------------------------------------------------------------------
// Development conveniences below. None of them are part of `build`, and the
// Plugin Hub does not run them - it invokes shadowJar, defined at the bottom.
//
// They exist because a plugin cannot be sideloaded into RuneLite: the client
// loads external plugins only from the Hub. Until this is published, the only
// way to put it in front of a tester is to hand them a client with it already
// compiled in, which is what these tasks assemble.
// ---------------------------------------------------------------------------

// A self-contained folder someone can unzip and run without Gradle, without a
// checkout, and without waiting for a first-run download. Everything the client
// needs is copied beside a launcher script; only a Java runtime is assumed.
// The launcher's main() lives in src/test beside the runClient task that normally
// invokes it. The bundle has no Gradle to hand it a classpath, so it needs to be a
// jar like everything else in lib.
tasks.register('launcherJar', Jar) {
    archiveClassifier = 'launcher'
    from sourceSets.test.output
}

tasks.register('bundle', Sync) {
    group = 'distribution'
    description = 'Assembles a runnable Follower Buddy client into build/bundle'
    dependsOn jar, 'launcherJar'

    into layout.buildDirectory.dir('bundle')

    into('lib') {
        from jar
        from tasks.named('launcherJar')
        from sourceSets.test.runtimeClasspath.filter { it.name.endsWith('.jar') }
    }

    from('INSTALL-BUNDLE.md')
    from('dist') {
        include 'run.bat'
        include 'run.sh'
        filePermissions { unix(0755) }
    }
}

tasks.register('bundleZip', Zip) {
    group = 'distribution'
    description = 'Zips the runnable bundle for handing to someone else'
    dependsOn 'bundle'
    from layout.buildDirectory.dir('bundle')
    archiveFileName = 'follower-buddy-runnable.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

// DO NOT REMOVE. Nothing in this repository calls shadowJar, which makes it
// look like dead code - it is not. The Plugin Hub's packager invokes it to
// produce the jar it publishes, so the task has to exist even though no task
// here depends on it.
//
// Established the hard way: deleting it as unused turned a green hub build red
// in the next submission, and it was the only functional change between them.
tasks.register('shadowJar', Jar) {
    archiveClassifier = 'shaded'
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
