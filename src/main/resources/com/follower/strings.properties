# The longer captions, tooltips and status lines the code shows, word for word,
# each under the key the code reads it by (Resources.text). Grouped by the class
# that shows them. A value keeps its spaces: a leading or trailing one is
# written \u0020, and a long one carries on over the next line after a \.

# FollowerPlugin
noName=No name for now, then. You can change the name any time in the plugin's settings, under \
	Follower.
nameLater=You can change the name any time in the plugin's settings, under Follower.
cacheUnread=The game cache hasn't been read yet. Log in, then try ::follower rebuild.
onlyYourScreen=. Everything it does happens on your screen, and nothing is sent to the game.
phrasesUnreadable=Couldn't read phrases.json, so the follower is quiet until it's fixed.
nameTooLong=Twenty characters is all a name can carry, so '
blankPage=Today's page is blank. Restful, I call that.
noRoomInFront=There's no room in front of you for me to stand.
sendHint=You can also hold Shift and right-click any tile to Send\u0020
namePrompt=Your new follower is waiting. What will you call it?
noModel=No follower model to place. Try ::follower rebuild.
useRegion=. Use that number under Locations in the Messages window.
errandsOff=Errands are off. Tick Go on errands under Errands to send it on one.
builtInReplace=' is one of the built-in looks and cannot be replaced. Pick it and edit it instead.
builtInDelete=' is one of the built-in looks and cannot be deleted. Edit it instead.

# DialogTree
answerOneWord='; an answer is a single plain word for a rule to match on
noAnswers=: no node answers anything, so nothing can come of it

# RuleLoader
ruleIncomplete=' needs a 'when' block and at least one of a non-empty 'say' list, an 'animation', or \
	'mirrorAnimation'

# DialogsDialog

# FollowerPanel
behaviourHint=\u0020in game for Talk-to, Stay, Dance, Wave and Step-in-front. Hold Shift and \
	right-click any tile to send it there.
identityCaption=Only you can see this follower. Dress it under Outfit; edit what it says under Talking; \
	see what it remembers under Memory.
showAllTip=Some wearable items (mostly quest and holiday ones) don't say which slot they belong \
	to. Tick to include them in every search.
itemsUnloaded=Item data didn't load - try restarting the client. If it keeps happening, report a bug.
muteTip=The follower stops talking. All your other speech settings are kept. Same switch as \
	Mute in settings.
chatboxTip=Every line also appears in the chatbox under the follower's name. Same switch as in \
	settings.
talkingCaption=What it says and when. Messages holds every line.
stayTip=Same as right-click Stay and Follow-me on the follower, and Follow me in settings
fixTip=Re-attaches the follower to the scene, then rebuilds it from the outfit
chattinessTip=How much it talks. Same setting as Chattiness in settings.
slotTip=Click a slot to change it; right-click to clear it.
stylesTip=Styles cycle live on the follower; colours are the game's own
commandsHint=Type any of these in the chat as ::follower <command>
bodyTip=Switches the whole body model, and the default kits with it
reloadTip=Re-reads phrases.json from disk
noMatches=\u0020items match - try "Show items from every slot"
errandsTip=Now and then it wanders off on a small errand and comes back. Same switch as Go on \
	errands in settings.
memoryCaption=What it remembers about you. The Reminiscing toggle in settings silences the lines that \
	use this; Forget everything in the window erases it.
memoryTip=Everything the follower knows about you, and the button that erases it
messagesTip=Everything the follower says, by subject, to read and edit
deleteProfileTip=Remove the selected profile. The built-in looks, and a profile a thrall wears, cannot \
	be removed.
thrallProfilesTip=Which profile stands in for each thrall. Same three settings as in Thrall mode.

# MemoryDialog
forgetConfirm=Everything it knows is erased for good: counts, bests, places,\nthe incident and \
	the day you met.\nThe follower meets you again as a stranger. There is no undo.
memoryHint=Everything the follower currently remembers about you. It is kept with this RuneLite \
	profile's settings, and the button below erases all of it for good.
forgetTip=Erase every count, best, place, and the day it met you. It meets you again as a \
	stranger.
memoryWhere=The Reminiscing toggle in settings silences the lines that use this; Forget everything \
	erases it.

# PhrasesDialog
notAPlace=(triggered by something other than a place - the messages can still be edited)
whereUnknown=The game hasn't said where you are yet - log in first.
newLocationIncomplete=new location needs a name, at least one region id and one message
notARegion=' isn't a region id the game uses - skipped
messagesHowTo=One message per line. Edit, remove or add lines, untick a rule to silence it, then Save \
	- changes reach the follower within a second.
messagesUnreadable=The messages file couldn't be read - it may have been hand-edited. Fix it or restore a \
	backup, then Reload.
findTip=Show only the rules in this category whose title, note or lines contain this
