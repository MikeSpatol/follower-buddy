# DialogsDialog
# public:cut dialogs-editor
dialogsHint=<html><body style='width:500px'>These are the conversations the follower <b>starts</b>. \
	While it is waiting for an answer, its Talk-to option becomes Answer and opens the \
	conversation it asked about instead of the everyday one.<br><b>Says</b> is one page per \
	line, spoken by whoever is picked beside the node. <b>Choices</b> are one per line, \
	written <code>label -&gt; node-id</code>. <b>Answer</b> is what reaching that node \
	records as your reply.</html>
dialogsUnreadable=The conversations file couldn't be read - it may have been hand-edited. Fix it or \
	restore a backup, then Reload.
addNodeTip=A new step in this conversation. Point something at it with Next or a Choice, or \
	nothing will ever reach it.
deleteNodeTip=Remove this node. Anything pointing at it will need repointing, and Save will say so.
# public:end dialogs-editor

# FollowerPanel
behaviourHint=\u0020in game for Talk-to, Stay, Dance, Wave, Step-in-front and Read-chronicle. Hold \
	Shift and right-click any tile to send it there.
identityCaption=Only you can see this follower. Dress it under Outfit; edit what it says under Talking; \
	see what it remembers under Memory.
showAllTip=Some wearable items (mostly quest and holiday ones) don't say which slot they belong \
	to. Tick to include them in every search.
itemsUnloaded=Item data didn't load - try restarting the client. If it keeps happening, report a bug.
muteTip=The follower stops talking. All your other speech settings are kept. Same switch as \
	Mute in settings.
chatboxTip=Every line also appears in the chatbox under the follower's name. Same switch as in \
	settings.
talkingCaption=What it says and when. Messages holds every line; Conversations the talks it starts \
	itself.
stayTip=Same as right-click Stay and Follow-me on the follower, and Follow me in settings
fixTip=Re-attaches the follower to the scene, then rebuilds it from the outfit
chattinessTip=How much it talks. Same setting as Chattiness in settings.
slotTip=Click a slot to change it; right-click to clear it.
stylesTip=Styles cycle live on the follower; colours are the game's own
commandsHint=Type any of these in the chat as ::follower <command>
bodyTip=Switches the whole body model, and the default kits with it
reloadTip=Re-reads phrases.json and the attached sounds from disk
noMatches=\u0020items match - try "Show items from every slot"
