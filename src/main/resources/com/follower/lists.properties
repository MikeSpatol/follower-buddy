# The small word and id lists the code reads once, each under the name of
# the constant that holds it, comma separated, no spaces round the commas.
# Read by com.follower.Resources (list, words, ids); the constants keep
# their notes. A list can start with empty entries (tens: no word for
# zero or ten), never end with one.

