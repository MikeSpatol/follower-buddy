# public:file skilling
# The skilling company's tables, read once by SkillingController and Borrow.
# Each line is a key, =, and its values separated by commas.

# The option words that start work, matched whole after tag stripping and
# without case, by the skill each points at. Read off the cache: the same
# work under other words (Chop, Cut, Small Net and the rest). The
# Wintertodt brazier is fed, not lit, once it is burning. A word under no
# skill (Use) could be anything, and the first XP drop says what.
option.woodcutting=Chop down,Chop,Chop-down,Cut,Cut down,Cut-Down
option.mining=Mine
option.fishing=Fish,Net,Harpoon,Cage,Bait,Lure,Small Net,Big Net,Use-rod
option.cooking=Cook
option.smithing=Smith,Smelt
option.crafting=Craft,Spin,Weave
option.prayer=Pray-at,Bury
option.runecraft=Craft-rune
option.farming=Rake,Plant,Harvest,Check-health,Pick
option.thieving=Steal-from,Pickpocket
option.construction=Build
option.firemaking=Light,Burn,Feed
option.hunter=Lay,Set-trap,Catch
option.=Use

# The work the game lets a player do from one side only: every object
# with a work option whose cache definition carries an access mask. The
# client drops that mask when it loads the definition, so it cannot be
# read at run time; this is it, read off the cache. Everything else is
# worked from any side a fence does not close. Ranges, ovens, a stove and
