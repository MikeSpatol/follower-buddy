# The condition types that are an event and nothing more, read by Condition.
# Each line: the type in lower case = the TriggerEvent.Type it is true on,
# then the fields that narrow it against that event, if any: "is" and
# "names" (wildcards ok) match the event's name, "contains" its message.
# Every other condition type is a case in Condition's switch.

# public:cut company-extras,noticing
# The follower noticed something and went to look at it. "is" is the kind
# (valuable, nest, impling, star, landmark); "contains" narrows on the
# thing's name. {kind}, {thing}.
noticed=NOTICED is contains

# public:end company-extras,noticing
# public:cut company-extras,will
# A Send the follower had misgivings about: it has stopped at the edge and
# turned to the player. "is" is the kind (wilderness, monster);
# {misgiving}, {thing}.
hesitated=HESITATED is

# The player walked straight at the parked follower and it stepped aside
# at the last tick.
steppedaside=STEPPED_ASIDE

# public:end company-extras,will
# public:cut agility,agility-all
# The follower did an agility obstacle after the player. "is" is "fell"
# for a fall copied, "crossed" for a clean one.
crossed=CROSSED is

# public:end agility,agility-all
# public:cut agility-all,marks
# A mark of grace on a rooftop course. "is" is "spotted", "left" (walked
# past and on to the next obstacle) or "collected".
grace=GRACE is

# public:end agility-all,marks
# The logout tab opening. The body waves; this is the rare word.
farewell=FAREWELL

playerdeath=PLAYER_DEATH
login=LOGIN

thrallstart=THRALL_START
thrallswitch=THRALL_SWITCH
thrallend=THRALL_END

# public:cut errands
errandstart=ERRAND_START names
errandend=ERRAND_END names

# public:end errands
# public:cut spectate
# The moment a fight starts, as opposed to "combat", which stays true
# throughout one. Optional names match what is fought.
combatstart=COMBAT_START names

# public:end spectate
# The two ends of a thieving session. Everything between them is silent,
# and these are what make that silence read as the follower giving the
# player room rather than having broken.
thievingstart=THIEVING_START
thievingend=THIEVING_END

# You clicked the tile the follower was standing on.
underfoot=UNDERFOOT

# public:cut side-games
# A challenge was met, or ran out. {challenge} names it.
challengemet=CHALLENGE_MET
challengefailed=CHALLENGE_FAILED

# public:end side-games
# public:cut souvenirs-wishes
souvenirlost=SOUVENIR_LOST

# public:end souvenirs-wishes
# public:cut side-games
betwon=BET_WON
betlost=BET_LOST

# public:end side-games
# A world hop landed. Rare by nature, so no flood guard needed.
worldhop=WORLD_HOP

# First login since the game itself changed under everyone's feet.
gameupdated=GAME_UPDATE

# The notebook was edited from outside and hot-reloaded. In-world this is
# somebody writing in the scribe's own book.
notesedited=NOTES_EDITED

musicunlock=MUSIC_UNLOCK

# The music changed to another track - the town's own song, where
# musicUnlock is hearing one for the FIRST time. Names narrow it to
# particular tracks, which is how a rule gets an opinion about Sea Shanty 2
# without one about everything.
musictrack=TRACK_CHANGE names

collectionadd=COLLECTION_ADD
questcomplete=QUEST_COMPLETE

# public:cut chronicle
# A chronicle page was written for the first time. "is" narrows it to one
# kind of page met or walked into (boss, enemy, location, faction, world),
# or "quest" for any page a quest opened.
pagewritten=PAGE_WRITTEN is

# public:end chronicle
# A Grand Exchange offer finished; "is" narrows to bought or sold.
geoffer=GE_OFFER is

channeljoined=CHANNEL_JOIN
channelleft=CHANNEL_LEAVE

# A named NPC's overhead line. Names match like npcSpawn's and the message
# like chatMessage's contains: the message alone, never tried against the
# names, which would quietly widen what a rule matches.
npcshout=NPC_SHOUT names contains

wantfulfilled=WANT_FULFILLED
wantexpired=WANT_EXPIRED

examined=EXAMINED

# The player examined something - the other direction. Names narrow it to
# particular things, so the scarecrow can have its own line without
# everything having one.
examinedthing=EXAMINED_THING names

# The player came back from a long absence during which the follower
# walked round to peer at them. The check itself is silent - the damper
# holds while nobody is there to read a line - so this is the payoff,
# landing on a present player.
attendedagain=ATTENDED_AGAIN

# The follower finished minuting one of the player's NPC dialogs: it
# stepped aside, wrote through the meeting, and put the scroll away as the
# box closed.
minutestaken=MINUTES_TAKEN

# The moment a record was beaten. {record}, {value} and {previous} are on
# the event; "names" narrows to particular records.
personalbest=RECORD names

# public:cut skilling
workended=WORK_END names
targetdepleted=TARGET_DEPLETED
bagfull=BAG_FULL
baghalf=BAG_HALF

# public:end skilling
