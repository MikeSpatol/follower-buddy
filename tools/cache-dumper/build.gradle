plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

dependencies {
    // The cache library exposes ItemDefinition.maleModel0 etc, which the runtime
    // RuneLite API deliberately does not.
    implementation group: 'net.runelite', name: 'cache', version: 'latest.release'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'com.follower.tools.EquipmentDumper'
}

// Checks every location rule's region ids against the world map's own labels.
//   gradlew runAudit --args="<phrases.json> [cacheDir]"
// Correlates learned stances against item params, to find out whether weapon
// animations can be read from the cache instead of observed.
//   gradlew runProbe --args="<stances.json>"
tasks.register('runProbe', JavaExec) {
    group = 'verification'
    description = 'Probes whether weapon animations live in item params'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.StanceParamProbe'
}

tasks.register('runStructProbe', JavaExec) {
    group = 'verification'
    description = 'Probes whether weapon stance sets live in cache structs'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.StanceStructProbe'
}

tasks.register('runArchiveProbe', JavaExec) {
    group = 'verification'
    description = 'Scans every cache archive for paired weapon pose ids'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.StanceArchiveProbe'
}

tasks.register('runEnumProbe', JavaExec) {
    group = 'verification'
    description = 'Decodes enums looking for a weapon to stance mapping'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.StanceEnumProbe'
}

tasks.register('runPetProbe', JavaExec) {
    group = 'verification'
    description = 'Lists NPCs the game treats as pets, for the greeting rule'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.PetProbe'
}

tasks.register('runSeqInfo', JavaExec) {
    group = 'verification'
    description = 'Prints what an animation id is, to check ids from outside the game'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.SequenceInfo'
}

// The same check for the names the PLUGIN hardcodes: errand scene objects and
// NPCs, and the standard pose ids.
//   gradlew runSceneAudit
tasks.register('runSceneAudit', JavaExec) {
    group = 'verification'
    description = 'Audits hardcoded scene names and pose ids against the cache'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.SceneNameAudit'
}

// Every object in the game that can be set light to, and whether HotGround
// would know to walk the follower round it. A name-based match fails silently.
//   gradlew runFireAudit
tasks.register('runFireAudit', JavaExec) {
    group = 'verification'
    description = 'Audits the hot-ground fire names against the cache'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.FireAudit'
}

// The pixel size of interface sprites, and a PNG of each, straight from the
// cache. The API names them but not their sizes.
//   gradlew runSpriteProbe --args="--out <dir> 310 311 312 313"
tasks.register('runSpriteProbe', JavaExec) {
    group = 'verification'
    description = 'Prints the size of the given sprite ids and writes them as PNGs'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.SpriteProbe'
}

// Checks that every NPC name and item id the rules key on actually exists.
// A name that matches nothing is a rule that can never fire, and says nothing.
//   gradlew runTargetAudit --args="<phrases.json> [cacheDir]"
tasks.register('runTargetAudit', JavaExec) {
    group = 'verification'
    description = 'Audits rule NPC names and item ids against the cache'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.RuleTargetAudit'
}

tasks.register('runAudit', JavaExec) {
    group = 'verification'
    description = 'Audits phrases.json location regions against the game world map'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.RegionAudit'
}

// Looks a name up in the cache, for when a question about an NPC deserves an
// answer from the game rather than from memory.
// Every portrait in the chronicle: a real NPC, and its idle the NPC's own
// standing animation, which the plugin cannot look up at runtime.
//   gradlew runChronicleAudit
tasks.register('runChronicleAudit', JavaExec) {
    group = 'verification'
    description = 'Audits the chronicle portraits and their idle animations against the cache'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.ChronicleAudit'
}

//   gradlew runNpcFind --args="brutus"
tasks.register('runNpcFind', JavaExec) {
    group = 'verification'
    description = 'Finds NPCs in the cache whose name contains the given text'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.NpcFind'
}

// Asks whether the cache already knows a weapon's attack animation, so the
// stance backlog is only asked of the community if it genuinely has to be.
//   gradlew runWeaponAnims --args="4151 1333 841"
tasks.register('runWeaponAnims', JavaExec) {
    group = 'verification'
    description = 'Prints item params and category for named weapons'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.follower.tools.WeaponAnimProbe'
}
